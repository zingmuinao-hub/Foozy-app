<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Create Your Account | FoodRush</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f5f6;
  color: #242424;
  min-height: 100vh;
}

.topbar {
  background: #ffffff;
  padding: 20px 7%;
  border-bottom: 1px solid #e9e9e9;
}

.logo {
  color: #f47721;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: #292929;
}

.wrapper {
  width: 100%;
  max-width: 480px;
  margin: 38px auto;
  padding: 0 18px;
}

.card {
  background: #ffffff;
  border: 1px solid #e8e8e8;
  border-radius: 18px;
  padding: 30px 25px;
  box-shadow: 0 8px 35px rgba(0,0,0,0.035);
}

.badge {
  display: inline-block;
  background: #f2f2f2;
  color: #555;
  padding: 7px 12px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 18px;
}

h1 {
  font-size: 29px;
  letter-spacing: -0.8px;
  margin-bottom: 10px;
}

.subtitle {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 26px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #dedede;
  background: #fafafa;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
  margin-bottom: 18px;
  color: #222;
}

input:focus {
  border-color: #f47721;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(244,119,33,0.09);
}

button {
  width: 100%;
  padding: 15px;
  background: #f47721;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 5px;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 13px;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 18px;
  overflow-wrap: anywhere;
}

.message.success {
  display: block;
  color: #176b3a;
  background: #eaf8ef;
}

.message.error {
  display: block;
  color: #a52626;
  background: #fff0f0;
}

.footer {
  text-align: center;
  margin-top: 23px;
  color: #777;
  font-size: 14px;
}

.footer a {
  color: #f47721;
  font-weight: 700;
  text-decoration: none;
}

.terms {
  font-size: 12px;
  line-height: 1.6;
  color: #888;
  margin-top: 17px;
  text-align: center;
}

@media (max-width: 400px) {
  .card {
    padding: 25px 19px;
  }

  h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">foodRush<span>.</span></div>
</header>

<main class="wrapper">
  <section class="card">

    <div class="badge">YOUR TOWN. YOUR FOOD.</div>

    <h1>Create your account.</h1>

    <p class="subtitle">
      Join FoodRush and discover delicious food from your
      favourite local restaurants in Ukhrul.
    </p>

    <div id="message" class="message" role="status"
         aria-live="polite"></div>

    <form id="signupForm">

      <label for="name">Full name</label>
      <input
        id="name"
        type="text"
        autocomplete="name"
        placeholder="Enter your full name"
        maxlength="100"
        required
      >

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="phone">Phone number</label>
      <input
        id="phone"
        type="tel"
        autocomplete="tel"
        placeholder="Enter your phone number"
        maxlength="20"
        required
      >

      <label for="address">Delivery address</label>
      <input
        id="address"
        type="text"
        autocomplete="street-address"
        placeholder="Your area or delivery address"
        maxlength="300"
        required
      >

      <label for="password">Create password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter your password again"
        minlength="8"
        required
      >

      <button id="signupButton" type="submit">
        Create Account →
      </button>

      <p class="terms">
        By creating an account, you agree to use FoodRush
        responsibly and provide accurate information.
      </p>

    </form>
  </section>

  <div class="footer">
    Already have an account?
    <a href="customer.html">Log in</a>
  </div>
</main>

<script>
/*
  IMPORTANT:
  Copy your existing SUPABASE_URL and SUPABASE_KEY
  values from customer.html into the two lines below.
  Use your existing public/anon or publishable key.
  NEVER use a service_role or secret key in browser code.
*/

const SUPABASE_URL = "https://snmufxscviahmmsdbess.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ix1rMiMTqPQIsBEM708shg_POK6_JM8";

const message = document.getElementById("message");
const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");

let db = null;

try {
  if (
    window.supabase &&
    SUPABASE_URL.startsWith("https://") &&
    SUPABASE_KEY !== "PASTE_YOUR_EXISTING_PUBLIC_SUPABASE_KEY"
  ) {
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
} catch (error) {
  console.error("Foozy initialization error:", error);
}

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!db) {
    showMessage(
      "Supabase is not configured yet. Copy the existing Supabase URL and public key from customer.html into this file.",
      "error"
    );
    return;
  }

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (!name || !email || !phone || !address) {
    showMessage("Please complete all the fields.", "error");
    return;
  }

  if (password.length < 8) {
    showMessage(
      "Your password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Your passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating your account...";

  try {
    const { data, error } = await db.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          name: name,
          phone: phone,
          address: address,
          role: "customer"
        }
      }
    });

    if (error) {
      throw error;
    }

    if (!data.user) {
      throw new Error(
        "Your account could not be created. Please try again."
      );
    }

    if (data.session) {
      showMessage(
        "Welcome to Foozy, " + name +
        "! Your account has been created successfully. Opening Foozy...",
        "success"
      );

      button.textContent = "Account Created!";

      setTimeout(function() {
        window.location.href = "index.html";
      }, 1800);

    } else {
      showMessage(
        "Your registration was submitted successfully! Please check " +
        email +
        " for a verification email. After verifying your email, log in to Foozy.",
        "success"
      );

      button.textContent = "Registration Submitted";
    }

  } catch (error) {
    console.error("Foozy registration error:", error);

    let errorText = error.message ||
      "Something went wrong. Please try again.";

    if (errorText.toLowerCase().includes("already registered")) {
      errorText =
        "This email is already registered. Please log in instead.";
    }

    showMessage(errorText, "error");

    button.disabled = false;
    button.textContent = "Create Account →";
  }
});
</script>

</body>
  </html>
