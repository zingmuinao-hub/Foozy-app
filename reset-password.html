
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Foozy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #fff7ed;
      font-family: Arial, sans-serif;
      color: #29231f;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000012;
    }

    .logo {
      color: #e66b24;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    p {
      text-align: center;
      color: #777;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #e66b24;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    a {
      color: #e66b24;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🍔 Foozy</div>

    <h1>Reset your password</h1>

    <p>Choose a new password to secure your Foozy account.</p>

    <form id="reset-form">
      <input
        id="password"
        type="password"
        placeholder="New password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <input
        id="confirm-password"
        type="password"
        placeholder="Confirm new password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="submit-button" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status">
      Verifying your recovery link...
    </p>

    <p>
      <a href="./">Return to Foozy</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Replace these two placeholders with the SAME values
    // used in your existing Foozy index.html.
    const SUPABASE_URL = "https://snmufxscviahmmsdbess.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ix1rMiMTqPQIsBEM708shg_POK6_JM8";

    const message = document.getElementById("message");
    const form = document.getElementById("reset-form");
    const button = document.getElementById("submit-button");

    form.hidden = true;

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let recoveryVerified = false;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (
        (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") &&
        session
      ) {
        recoveryVerified = true;
        form.hidden = false;
        message.textContent = "Recovery link verified. Enter your new password.";
      }
    });

    async function checkRecoverySession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        message.textContent =
          "Could not verify your link. Please request a new recovery email.";
        return;
      }

      if (data.session && window.location.hash.includes("access_token=")) {
        recoveryVerified = true;
        form.hidden = false;
        message.textContent =
          "Recovery link verified. Enter your new password.";
      } else if (!recoveryVerified) {
        message.textContent =
          "This recovery link is missing or expired. Please request a new one.";
      }
    }

    checkRecoverySession();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!recoveryVerified) {
        message.textContent =
          "Your recovery link has not been verified. Please request a new one.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        message.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Could not update password: " + error.message;
        button.disabled = false;
        button.textContent = "Update Password";
        return;
      }

      recoveryVerified = false;
      form.hidden = true;
      message.textContent =
        "Password updated successfully! You can now sign in with your new password.";
      button.disabled = false;
      button.textContent = "Update Password";
    });
  </script>
</body>
</html>
