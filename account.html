<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>My Account | Foozy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --orange: #ff641f;
  --bg: #101010;
  --card: #1c1c1c;
  --surface: #252525;
  --border: #353535;
  --text: #fff;
  --muted: #aaa;
  --green: #39b86a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 95px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(650px, 92%);
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(16,16,16,.96);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}

.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 0;
}

.logo {
  font-size: 29px;
  font-weight: 1000;
  letter-spacing: -1.5px;
}

.logo span {
  color: var(--orange);
}

.back-btn {
  background: var(--surface);
  color: white;
  border: 1px solid var(--border);
  padding: 9px 13px;
  border-radius: 11px;
}

.page-title {
  margin: 25px 0 18px;
}

.page-title h1 {
  font-size: 30px;
  font-weight: 1000;
}

.page-title p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: 15px;
  background: linear-gradient(135deg,#302016,#1c1c1c 70%);
  border: 1px solid #54301e;
  border-radius: 22px;
  padding: 21px;
  margin-bottom: 27px;
}

.avatar {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: var(--orange);
  display: grid;
  place-items: center;
  font-size: 29px;
  font-weight: 1000;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-info {
  min-width: 0;
  flex: 1;
}

.profile-info h2 {
  font-size: 19px;
  overflow-wrap: anywhere;
}

.profile-info p {
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
  margin-top: 3px;
}

.edit-btn {
  margin-top: 10px;
  background: var(--orange);
  color: white;
  border: 0;
  padding: 8px 13px;
  border-radius: 9px;
  font-weight: 900;
  font-size: 12px;
}

.section {
  margin-top: 26px;
}

.section-heading {
  font-size: 12px;
  letter-spacing: 1.6px;
  color: var(--muted);
  font-weight: 900;
  margin-bottom: 12px;
}

.menu-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  overflow: hidden;
}

.menu-row {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 67px;
  padding: 13px 15px;
  border-bottom: 1px solid #303030;
  width: 100%;
  text-align: left;
  background: transparent;
  color: white;
  border-top: 0;
  border-left: 0;
  border-right: 0;
}

.menu-row:last-child {
  border-bottom: 0;
}

.menu-row:active {
  background: var(--surface);
}

.icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 13px;
  background: #302219;
  font-size: 20px;
}

.row-content {
  flex: 1;
  min-width: 0;
}

.row-content strong {
  display: block;
  font-size: 14px;
  font-weight: 900;
}

.row-content small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.5;
}

.arrow {
  color: #777;
  font-size: 22px;
}

.badge {
  font-size: 10px;
  background: #382719;
  color: #ffad80;
  border-radius: 7px;
  padding: 5px 8px;
  font-weight: 900;
}

.signout {
  width: 100%;
  margin-top: 27px;
  background: #291b19;
  color: #ff785f;
  border: 1px solid #59302b;
  border-radius: 14px;
  padding: 15px;
  font-weight: 1000;
}

.footer-note {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 25px 0;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  background: #171717;
  border-top: 1px solid var(--border);
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: #888;
  font-size: 10px;
  font-weight: 800;
  min-width: 55px;
}

.nav-item span {
  font-size: 20px;
}

.nav-item.active {
  color: var(--orange);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000b;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 18px;
}

.overlay.show {
  display: flex;
}

.dialog {
  width: min(430px,100%);
  max-height: 85vh;
  overflow: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 21px;
  padding: 22px;
}

.dialog h2 {
  font-size: 21px;
  margin-bottom: 8px;
}

.dialog p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 16px;
  white-space: pre-line;
}

.dialog label {
  display: block;
  color: #ddd;
  font-size: 12px;
  font-weight: 900;
  margin: 13px 0 6px;
}

.dialog input {
  width: 100%;
  padding: 12px;
  color: white;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.dialog input:focus {
  border-color: var(--orange);
}

.dialog-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.dialog-actions button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 0;
  font-weight: 900;
}

.cancel-btn {
  background: var(--surface);
  color: white;
}

.save-btn {
  background: var(--orange);
  color: white;
}

.status {
  background: var(--surface);
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.7;
  color: #ddd;
}

@media(max-width:400px) {
  .profile-card {
    padding: 15px;
    gap: 10px;
  }
  .avatar {
    width: 52px;
    height: 52px;
  }
  .profile-info h2 {
    font-size: 16px;
  }
  .page-title h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="overlay" id="dialogOverlay">

<script>
/*
  Foozy Supabase configuration.
  The publishable key is intended for client-side use.
  Database access must still be protected by Supabase RLS policies.
*/
const SUPABASE_URL = "https://snmufxscviahmmsdbess.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ix1rMiMTqPQIsBEM708shg_POK6_JM8";

let db = null;
let currentUser = null;

try {
  if (window.supabase?.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (error) {
  console.error("Foozy connection setup failed:", error);
}

function showNotice(message) {
  const box = document.getElementById("accountNotice");
  box.textContent = message;
  box.style.display = "block";
}

function updateProfileDisplay(user) {
  const metadata = user.user_metadata || {};
  const name = metadata.full_name || metadata.name || "Foozy Customer";
  const phone = metadata.phone || user.phone || "";
  const email = user.email || "";

  document.getElementById("profileName").textContent = name;
  document.getElementById("profileEmail").textContent = email || "Email not provided";
  document.getElementById("profilePhone").textContent = phone ? "📱 " + phone : "";

  const avatar = document.getElementById("avatar");
  const photo = metadata.avatar_url || metadata.picture || "";

  if (photo) {
    const img = document.createElement("img");
    img.src = photo;
    img.alt = "Profile";
    img.onerror = () => {
      avatar.textContent = name.charAt(0).toUpperCase();
    };
    avatar.replaceChildren(img);
  } else {
    avatar.textContent = name.charAt(0).toUpperCase();
  }
}

async function loadAccount() {
  if (!db) {
    document.getElementById("profileName").textContent = "Welcome to Foozy";
    document.getElementById("profileEmail").textContent = "Account connection unavailable";
    showNotice("We couldn't initialize the account connection. Please check the Supabase configuration.");
    return;
  }

  try {
    const { data, error } = await db.auth.getUser();

    if (error) throw error;

    currentUser = data.user;

    if (!currentUser) {
      document.getElementById("profileName").textContent = "Welcome to Foozy";
      document.getElementById("profileEmail").textContent = "You're not signed in";
      showNotice("Sign in to view your personal details and manage your Foozy account.");
      return;
    }

    updateProfileDisplay(currentUser);
  } catch (error) {
    console.error("Could not load account:", error);
    document.getElementById("profileName").textContent = "Welcome to Foozy";
    document.getElementById("profileEmail").textContent = "Unable to load profile";
    showNotice("We couldn't load your account details. Please try again.");
  }
}

function openDialog(title, html, actions) {
  document.getElementById("dialogTitle").textContent = title;
  document.getElementById("dialogBody").innerHTML = html;

  const actionBox = document.getElementById("dialogActions");
  actionBox.replaceChildren();

  if (actions && actions.length) {
    actions.forEach(action => actionBox.appendChild(action));
  } else {
    const close = document.createElement("button");
    close.className = "cancel-btn";
    close.textContent = "Close";
    close.onclick = closeDialog;
    actionBox.appendChild(close);
  }

  document.getElementById("dialogOverlay").classList.add("show");
}

function makeButton(text, className, handler) {
  const button = document.createElement("button");
  button.textContent = text;
  button.className = className;
  button.onclick = handler;
  return button;
}

function closeDialog() {
  document.getElementById("dialogOverlay").classList.remove("show");
}

function openEditProfile() {
  if (!currentUser) {
    showNotice("Please sign in through Foozy before editing your profile.");
    return;
  }

  const metadata = currentUser.user_metadata || "";

  const name = currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name || "";

  const phone = currentUser.user_metadata?.phone ||
    currentUser.phone || "";

  const email = currentUser.email || "";

  openDialog("My Account", `
    <p>Update your Foozy account details.</p>

    <label for="editName">Full name</label>
    <input id="editName" maxlength="100"
      value="${escapeHTML(name)}" placeholder="Your full name">

    <label for="editPhone">Phone number</label>
    <input id="editPhone" type="tel" maxlength="25"
      value="${escapeHTML(phone)}" placeholder="Your phone number">

    <label for="editEmail">Email address</label>
    <input id="editEmail" type="email" maxlength="254"
      value="${escapeHTML(email)}" placeholder="Your email address">

    <p style="font-size:12px">
      Changing your email may require confirmation through your inbox.
    </p>
  `, [
    makeButton("Cancel", "cancel-btn", closeDialog),
    makeButton("Save Changes", "save-btn", saveProfile)
  ]);
}

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

async function saveProfile() {
  if (!db || !currentUser) return;

  const name = document.getElementById("editName").value.trim();
  const phone = document.getElementById("editPhone").value.trim();
  const email = document.getElementById("editEmail").value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
  }

  const oldEmail = (currentUser.email || "").trim();
  const saveButton = document.querySelector(".save-btn");

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  try {
    const existing = currentUser.user_metadata || {};

    const updatePayload = {
      data: {
        ...existing,
        full_name: name,
        name: name,
        phone: phone
      }
    };

    if (email.toLowerCase() !== oldEmail.toLowerCase()) {
      updatePayload.email = email;
    }

    const { data, error } = await db.auth.updateUser(updatePayload);

    if (error) throw error;

    currentUser = data.user;
    updateProfileDisplay(currentUser);
    closeDialog();

    if (email.toLowerCase() !== oldEmail.toLowerCase()) {
      showNotice("Profile saved! Check your inbox to confirm your new email address.");
    } else {
      showNotice("Your profile has been updated successfully!");
    }
  } catch (error) {
    console.error("Profile update failed:", error);
    alert(error.message || "Unable to save your profile. Please try again.");
    saveButton.disabled = false;
    saveButton.textContent = "Save Changes";
  }
}
let foozySavedAddresses = [];

async function showSavedAddresses() {
  if (!db || !currentUser) {
    openDialog("Sign In Required", `
      <div class="status">
        Please sign in to manage your saved delivery addresses.
      </div>
    `, [
      makeButton("Sign In", "save-btn", () => {
        location.href = "./customer.html?mode=signup&returnTo=account.html";
      }),
      makeButton("Cancel", "cancel-btn", closeDialog)
    ]);
    return;
  }

  openDialog("Saved Addresses", `
    <div class="status">Loading your saved addresses...</div>
  `);

  const { data, error } = await db
    .from("saved_addresses")
    .select("id,label,recipient_name,phone,address_line,landmark,delivery_instructions,is_default,created_at")
    .eq("user_id", currentUser.id)
    .order("is_default", { ascending: false })
    .order("created_at", { ascending: false });

  if (error) {
    openDialog("Saved Addresses", `
      <div class="status">
        Could not load your addresses. Please try again.
      </div>
    `, [
      makeButton("Close", "cancel-btn", closeDialog)
    ]);
    console.error("Saved addresses error:", error);
    return;
  }

  foozySavedAddresses = data || [];

  const addressHTML = foozySavedAddresses.length
    ? foozySavedAddresses.map(a => `
        <div class="status" style="margin-bottom:12px;text-align:left">
          <strong>${escapeHTML(a.label)}</strong>
          ${a.is_default ? '<span> · Default</span>' : ''}

          <p style="margin:8px 0 4px">
            ${escapeHTML(a.recipient_name)} · ${escapeHTML(a.phone)}
          </p>

          <p style="margin:4px 0">
            ${escapeHTML(a.address_line)}
          </p>

          ${a.landmark ? `
            <p style="margin:4px 0">
              Landmark: ${escapeHTML(a.landmark)}
            </p>
          ` : ''}

          ${a.delivery_instructions ? `
            <p style="margin:4px 0">
              Instructions: ${escapeHTML(a.delivery_instructions)}
            </p>
          ` : ''}

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
            <button class="save-btn"
              onclick="editSavedAddress('${a.id}')">Edit</button>

            ${!a.is_default ? `
              <button class="save-btn"
                onclick="setDefaultAddress('${a.id}')">
                Set Default
              </button>
            ` : ''}

            <button class="cancel-btn"
              onclick="deleteSavedAddress('${a.id}')">
              Delete
            </button>
          </div>
        </div>
      `).join("")
    : `<div class="status">You haven't saved any addresses yet.</div>`;

  openDialog("Saved Addresses", `
    ${addressHTML}
    <p style="margin-top:14px">
      Save your home or other delivery locations for easier checkout.
    </p>
  `, [
    makeButton("+ Add Address", "save-btn", () => {
      openSavedAddressForm();
    }),
    makeButton("Close", "cancel-btn", closeDialog)
  ]);
}

function openSavedAddressForm(address = null) {
  const a = address || {};

  openDialog(address ? "Edit Address" : "Add Address", `
    <div style="text-align:left">
      <label>Address Label</label>
      <input id="savedLabel" maxlength="40"
        placeholder="Home, Work, etc."
        value="${escapeHTML(a.label || "Home")}"
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">

      <label>Recipient Name *</label>
      <input id="savedRecipient" maxlength="100" required
        value="${escapeHTML(a.recipient_name || "")}"
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">

      <label>Phone Number *</label>
      <input id="savedPhone" maxlength="25" required
        type="tel" value="${escapeHTML(a.phone || "")}"
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">

      <label>Full Delivery Address *</label>
      <textarea id="savedAddress" maxlength="500" required
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">${escapeHTML(a.address_line || "")}</textarea>

      <label>Landmark (optional)</label>
      <input id="savedLandmark" maxlength="200"
        value="${escapeHTML(a.landmark || "")}"
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">

      <label>Delivery Instructions (optional)</label>
      <textarea id="savedInstructions" maxlength="500"
        style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px">${escapeHTML(a.delivery_instructions || "")}</textarea>

      <label style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <input id="savedDefault" type="checkbox"
          style="width:18px;height:18px;accent-color:#ff641f"
          ${a.is_default || !address ? "checked" : ""}>
        Make this my default address
      </label>
    </div>
  `, [
    makeButton("Cancel", "cancel-btn", () => showSavedAddresses()),
    makeButton("Save Address", "save-btn", () => saveSavedAddress(a.id || null))
  ]);
}

async function saveSavedAddress(addressId) {
  const label = document.getElementById("savedLabel").value.trim() || "Home";
  const recipient = document.getElementById("savedRecipient").value.trim();
  const phone = document.getElementById("savedPhone").value.trim();
  const addressLine = document.getElementById("savedAddress").value.trim();
  const landmark = document.getElementById("savedLandmark").value.trim();
  const instructions = document.getElementById("savedInstructions").value.trim();
  const isDefault = document.getElementById("savedDefault").checked;

  if (!recipient || !phone || addressLine.length < 3) {
    showNotice("Please enter the recipient name, phone number, and full address.");
    return;
  }

  if (!db || !currentUser) {
    showNotice("Please sign in again before saving.");
    return;
  }

  const values = {
    label,
    recipient_name: recipient,
    phone,
    address_line: addressLine,
    landmark: landmark || null,
    delivery_instructions: instructions || null,
    is_default: isDefault,
    updated_at: new Date().toISOString()
  };

  if (isDefault) {
    const { error: clearError } = await db
      .from("saved_addresses")
      .update({ is_default: false })
      .eq("user_id", currentUser.id);

    if (clearError) {
      console.error(clearError);
      showNotice("Couldn't update the default address. Please try again.");
      return;
    }
  }

  let result;

  if (addressId) {
    result = await db
      .from("saved_addresses")
      .update(values)
      .eq("id", addressId)
      .eq("user_id", currentUser.id);
  } else {
    result = await db
      .from("saved_addresses")
      .insert({
        ...values,
        user_id: currentUser.id
      });
  }

  if (result.error) {
    console.error("Save address error:", result.error);
    showNotice("Couldn't save the address. Please try again.");
    return;
  }

  showNotice("Address saved successfully!");
  await showSavedAddresses();
}

function editSavedAddress(addressId) {
  const address = foozySavedAddresses.find(a => a.id === addressId);

  if (address) {
    openSavedAddressForm(address);
  }
}

async function deleteSavedAddress(addressId) {
  if (!db || !currentUser) return;

  if (!confirm("Are you sure you want to delete this address?")) return;

  const { error } = await db
    .from("saved_addresses")
    .delete()
    .eq("id", addressId)
    .eq("user_id", currentUser.id);

  if (error) {
    console.error("Delete address error:", error);
    showNotice("Couldn't delete the address. Please try again.");
    return;
  }

  showNotice("Address deleted.");
  await showSavedAddresses();
}

async function setDefaultAddress(addressId) {
  if (!db || !currentUser) return;

  const { error: clearError } = await db
    .from("saved_addresses")
    .update({ is_default: false })
    .eq("user_id", currentUser.id);

  if (clearError) {
    showNotice("Couldn't update the default address.");
    return;
  }

  const { error } = await db
    .from("saved_addresses")
    .update({ is_default: true })
    .eq("id", addressId)
    .eq("user_id", currentUser.id);

  if (error) {
    console.error("Default address error:", error);
    showNotice("Couldn't set the default address.");
    return;
  }

  showNotice("Default address updated!");
  await showSavedAddresses();
}

return;
}

const descriptions = {
"My Refunds": "Refund information will appear here when Foozy's refund system is connected.",
"My Vouchers": "Your available coupons will appear here when the voucher system is connected.",
"Foozy Money": "Your wallet balance will appear here when the secure wallet system is connected.",
"Help & Support": "The Foozy support contact details will be added here."
};

feature,
"<div class="status">${escapeHTML(descriptions[feature] || "This feature is coming soon.")}</div>"

function orderStatusGroup(status) {
  const value = String(status || "").toLowerCase().replace(/[ -]+/g, "_");

  if ([
    "delivered", "completed", "cancelled", "canceled",
    "rejected", "refunded", "failed"
  ].includes(value)) {
    return "past";
  }

  return "active";
}

function formatOrderDate(value) {
  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Date unavailable";
  }

  return date.toLocaleString("en-IN", {
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function renderOrderCard(order) {
  const status = String(order.order_status || "Pending")
    .replace(/[_-]+/g, " ");

  let items = order.items;

  if (typeof items === "string") {
    try {
      items = JSON.parse(items);
    } catch {
      items = [];
    }
  }

  if (!Array.isArray(items)) {
    items = [];
  }

  const itemText = items.length
    ? items.map(item => {
        const name = item.name || item.food_name || item.title || "Food item";
        const quantity = Number(item.quantity) || 1;

        return `${escapeHTML(name)} × ${quantity}`;
      }).join("<br>")
    : "Order items";

  const amount = Number(order.total_amount || 0)
    .toLocaleString("en-IN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  return `
    <article class="status" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;gap:10px">
        <strong>Order #${escapeHTML(order.id)}</strong>
        <span class="badge">${escapeHTML(status)}</span>
      </div>

      <div style="font-size:12px;color:#aaa;margin-top:6px">
        ${escapeHTML(formatOrderDate(order.created_at))}
      </div>

      <div style="margin-top:12px;line-height:1.8">
        ${itemText}
      </div>

      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid #444">
        <span>${escapeHTML(order.payment_method || "Payment not specified")}</span>
        <strong>₹${escapeHTML(amount)}</strong>
      </div>
    </article>
  `;
}

async function showCustomerOrders(feature) {
  const isPast = feature === "Past Orders";

  openDialog(
    feature,
    '<div class="status">Loading your orders...</div>'
  );

  if (!db || !currentUser) {
    document.getElementById("dialogBody").innerHTML = `
      <div class="status">
        Please sign in to view orders linked to your Foozy account.
      </div>
      <div class="dialog-actions">
        <button class="save-btn"
          onclick="location.href='./customer.html?mode=signup&returnTo=account.html'">
          Sign In / Create Account
        </button>
      </div>
    `;
    return;
  }

  try {
    const { data, error } = await db
      .from("Order")
      .select(`
        id,
        created_at,
        items,
        total_amount,
        payment_method,
        order_status,
        customer_user_id
      `)
      .eq("customer_user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error) throw error;

    const orders = (data || []).filter(order =>
      orderStatusGroup(order.order_status) ===
      (isPast ? "past" : "active")
    );

    document.getElementById("dialogBody").innerHTML = `
      <p>
        ${isPast
          ? "Your completed and closed orders."
          : "Your current orders and their latest statuses."}
      </p>

      ${orders.length
        ? orders.map(renderOrderCard).join("")
        : `
          <div class="status">
            ${isPast
              ? "No past orders are linked to your account yet."
              : "You don't have any active orders linked to your account right now."}
          </div>

          <div class="dialog-actions">
            <button class="save-btn"
              onclick="location.href='./index.html?skipIntro=1'">
              Explore Food
            </button>
          </div>
        `}
    `;
  } catch (error) {
    console.error("Could not load customer orders:", error);

    document.getElementById("dialogBody").innerHTML = `
      <div class="status">
        We couldn't load your orders right now. Please try again.
      </div>
    `;
  }
}

async function sendPasswordReset() {
  if (!db || !currentUser?.email) {
    alert("We couldn't find an email address for this account.");
    return;
  }

  try {
    const { error } = await db.auth.resetPasswordForEmail(
      currentUser.email,
      {
        redirectTo:
          location.origin +
          location.pathname.replace(
            /account\.html$/i,
            "reset-password.html"
          )
      }
    );

    if (error) throw error;

    closeDialog();
    showNotice("Password reset email sent. Check your inbox and spam folder.");
  } catch (error) {
    console.error("Password reset failed:", error);
    alert("We couldn't send the reset email. Please try again.");
  }
}

async function logout() {
  if (!db) {
    showNotice("Account connection unavailable. Please refresh and try again.");
    return;
  }

  if (!currentUser) {
    showNotice("You're not signed in to a Foozy account.");
    return;
  }

  const confirmButton = makeButton("Log Out", "save-btn", async () => {
    confirmButton.disabled = true;
    confirmButton.textContent = "Logging out...";

    try {
      const { error } = await db.auth.signOut();
      if (error) throw error;

      currentUser = null;
      location.href = "./signup.html";
    } catch (error) {
      console.error("Logout failed:", error);
      alert("We couldn't log you out. Please try again.");
      confirmButton.disabled = false;
      confirmButton.textContent = "Log Out";
    }
  });

  openDialog("Log out of Foozy?", "<p>Are you sure you want to sign out of your account on this device?</p>", [
    makeButton("Cancel", "cancel-btn", closeDialog),
    confirmButton
  ]);
}
