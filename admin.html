<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Foozy Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .panel, .application {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin: 4px 4px 4px 0;
    }

    .primary { background: #f97316; color: white; }
    .approve { background: #15803d; color: white; }
    .reject { background: #b91c1c; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }

    .hidden { display: none; }

    .muted { color: #6b7280; font-size: 14px; }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status.approved {
      background: #dcfce7;
      color: #166534;
    }

    .status.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    #message {
      padding: 12px;
      border-radius: 9px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      header, .panel, .application { padding: 16px; }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h1>🍔 Foozy Admin</h1>
    <p>Manage restaurant and delivery partner applications.</p>
  </header>

  <div id="message" role="status" aria-live="polite">
    Initializing Foozy Admin...
  </div>

  <section id="loginPanel" class="panel hidden">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username"
             required placeholder="Your admin email">

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required
             placeholder="Your password">

      <button class="primary" type="submit">Sign In</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <strong>Administrator</strong>
      <p id="adminEmail" class="muted"></p>
      <button id="refreshButton" class="secondary" type="button">
        Refresh Applications
      </button>
      <button id="logoutButton" class="secondary" type="button">
        Sign Out
      </button>
    </div>

    <div class="panel">
      <h2>Applications</h2>
      <p class="muted">
        Review each application before making a decision.
      </p>

      <label for="filter">Filter applications</label>
      <select id="filter" style="width:100%;padding:12px;border-radius:9px;">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="all">All applications</option>
      </select>
    </div>

    <div id="applications"></div>
    <div class="panel">
  <h2>💰 Foozy Pricing Settings</h2>
  <p class="muted">
    Change your commission rates and monthly platform fee.
  </p>

  <form id="pricingForm">
    <label for="monthlyFee">Monthly platform fee (₹)</label>
    <input
      id="monthlyFee"
      type="number"
      min="0"
      step="0.01"
      value="99"
      required
    >

    <label for="restaurantCommission">
      Restaurant commission (%)
    </label>
    <input
      id="restaurantCommission"
      type="number"
      min="0"
      max="100"
      step="0.01"
      value="2"
      required
    >

    <label for="deliveryCommission">
      Delivery partner commission (%)
    </label>
    <input
      id="deliveryCommission"
      type="number"
      min="0"
      max="100"
      step="0.01"
      value="5"
      required
    >

    <button class="primary" type="submit">
      Save Pricing
    </button>
  </form>

  <p id="pricingMessage" class="muted" role="status"></p>
    </div>
  </section>

</div>

<script>
(() => {
  const SUPABASE_URL =
    "https://snmufxscviahmmsdbess.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Ix1rMiMTqPQIsBEM708shg_POK6_JM8";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);

  function showMessage(text) {
    $("message").textContent = text;
    $("message").classList.remove("hidden");
  }

  function hideMessage() {
    $("message").classList.add("hidden");
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showLogin() {
    $("loginPanel").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
  }

  function showDashboard(user) {
    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("adminEmail").textContent = user.email || "Signed in";
  }

  async function checkAdmin(user) {
    const { data, error } = await db.rpc("is_foozy_admin");

    if (error) {
      throw new Error(
        "Could not verify admin permissions. Check the Supabase function and permissions."
      );
    }

    if (data !== true) {
      await db.auth.signOut();
      showLogin();
      throw new Error(
        "This account is not authorized to access Foozy Admin."
      );
    }

    showDashboard(user);
    await loadApplications();
  }

  async function loadApplications() {
    $("applications").textContent = "Loading applications...";

    const { data, error } = await db
      .from("partner_applications")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      $("applications").textContent = "";
      showMessage(
        "Unable to load applications. Check table permissions and RLS."
      );
      return;
    }

    const filter = $("filter").value;
    const rows = (data || []).filter(app =>
      filter === "all" || app.status === filter
    );

    if (rows.length === 0) {
      $("applications").textContent =
        "No applications found for this filter.";
      hideMessage();
      return;
    }

    $("applications").innerHTML = rows.map(app => {
      const isRestaurant = app.application_type === "restaurant";

      return `
        <article class="application">
          <h3>${escapeHTML(
            isRestaurant ? "🍽️ Restaurant application" :
                           "🛵 Delivery partner application"
          )}</h3>

          <p><strong>Applicant:</strong>
            ${escapeHTML(app.full_name)}</p>

          <p><strong>Phone:</strong>
            ${escapeHTML(app.phone)}</p>

          ${isRestaurant ? `
            <p><strong>Restaurant:</strong>
              ${escapeHTML(app.restaurant_name || "Not provided")}</p>
            <p><strong>Address:</strong>
              ${escapeHTML(app.restaurant_address || "Not provided")}</p>
          ` : `
            <p><strong>Vehicle details:</strong>
              ${escapeHTML(app.vehicle_details || "Not provided")}</p>
          `}

          <p><strong>Submitted:</strong>
            ${escapeHTML(new Date(app.created_at).toLocaleString())}</p>

          <p><strong>Status:</strong>
            <span class="status ${escapeHTML(app.status)}">
              ${escapeHTML(app.status)}
            </span>
          </p>

          ${app.admin_notes ? `
            <p><strong>Admin notes:</strong>
              ${escapeHTML(app.admin_notes)}</p>
          ` : ""}

          <label for="note-${escapeHTML(app.id)}">
            Admin note or rejection reason
          </label>
          <textarea id="note-${escapeHTML(app.id)}"
            maxlength="1000"
            placeholder="Optional note for the applicant">${escapeHTML(app.admin_notes || "")}</textarea>

          <div>
            <button class="approve" type="button"
              data-action="approved" data-id="${escapeHTML(app.id)}">
              Approve
            </button>

            <button class="reject" type="button"
              data-action="rejected" data-id="${escapeHTML(app.id)}">
              Reject
            </button>

            <button class="secondary" type="button"
              data-action="pending" data-id="${escapeHTML(app.id)}">
              Set Pending
            </button>
          </div>
        </article>
      `;
    }).join("");

    hideMessage();
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = event.submitter;
    button.disabled = true;
    showMessage("Signing in...");

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;

      await checkAdmin(data.user);
      showMessage("Welcome to Foozy Admin!");
    } catch (error) {
      showMessage(error.message || "Sign-in failed.");
    } finally {
      button.disabled = false;
    }
  });

  $("applications").addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const status = button.dataset.action;
    const note = $("note-" + id).value.trim();

    if (status === "rejected" && !note) {
      showMessage("Please enter a reason before rejecting.");
      $("note-" + id).focus();
      return;
    }

    const label = status === "approved" ? "approve" :
                  status === "rejected" ? "reject" : "return to pending";

    if (!confirm(`Are you sure you want to ${label} this application?`)) {
      return;
    }

    button.disabled = true;
    showMessage("Saving your decision...");

    try {
      const { error } = await db
        .from("partner_applications")
        .update({
          status,
          admin_notes: note || null,
          reviewed_at: status === "pending" ? null : new Date().toISOString()
        })
        .eq("id", id);

      if (error) throw error;

      showMessage("Application updated successfully.");
      await loadApplications();
    } catch (error) {
      showMessage(
        error.message || "Could not update the application."
      );
    } finally {
      button.disabled = false;
    }
  });

  $("refreshButton").addEventListener("click", loadApplications);
  $("filter").addEventListener("change", loadApplications);

  $("logoutButton").addEventListener("click", async () => {
    await db.auth.signOut();
    $("dashboard").classList.add("hidden");
    showLogin();
    showMessage("You have signed out.");
  });

  async function initialize() {
    try {
      const { data, error } = await db.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        showLogin();
        showMessage("Please sign in with your Foozy admin account.");
        return;
      }

      await checkAdmin(data.session.user);
      showMessage("Welcome to Foozy Admin!");
    } catch (error) {
      showLogin();
      showMessage(error.message || "Could not initialize admin panel.");
    }
  }

  initialize();
})();
</script>
  <script>
async function loadFoozyPricing() {
  const message = document.getElementById("pricingMessage");

  const { data, error } = await db
    .from("foozy_settings")
    .select("*")
    .eq("id", 1)
    .single();

  if (error) {
    message.textContent = "Could not load pricing. Please try again.";
    return;
  }

  document.getElementById("monthlyFee").value =
    data.monthly_platform_fee;

  document.getElementById("restaurantCommission").value =
    data.restaurant_commission_percent;

  document.getElementById("deliveryCommission").value =
    data.delivery_partner_commission_percent;

  message.textContent = "Pricing loaded successfully.";
}

document.getElementById("pricingForm")
  .addEventListener("submit", async function (event) {
    event.preventDefault();

    const message = document.getElementById("pricingMessage");
    const button = this.querySelector('button[type="submit"]');

    const monthlyFee = Number(
      document.getElementById("monthlyFee").value
    );

    const restaurantCommission = Number(
      document.getElementById("restaurantCommission").value
    );

    const deliveryCommission = Number(
      document.getElementById("deliveryCommission").value
    );

    if (
      !Number.isFinite(monthlyFee) ||
      monthlyFee < 0 ||
      !Number.isFinite(restaurantCommission) ||
      restaurantCommission < 0 ||
      restaurantCommission > 100 ||
      !Number.isFinite(deliveryCommission) ||
      deliveryCommission < 0 ||
      deliveryCommission > 100
    ) {
      message.textContent = "Please enter valid pricing values.";
      return;
    }

    button.disabled = true;
    message.textContent = "Saving pricing...";

    try {
      const { error } = await db
        .from("foozy_settings")
        .update({
          monthly_platform_fee: monthlyFee,
          restaurant_commission_percent: restaurantCommission,
          delivery_partner_commission_percent: deliveryCommission,
          updated_at: new Date().toISOString()
        })
        .eq("id", 1);

      if (error) throw error;

      message.textContent = "✅ Foozy pricing saved successfully!";
    } catch (error) {
      console.error(error);
      message.textContent =
        "❌ Could not save pricing. Check your admin login and permissions.";
    } finally {
      button.disabled = false;
    }
  });

loadFoozyPricing();
      </script>
</body>
</html>
