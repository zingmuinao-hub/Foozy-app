<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodRush Icon Generator</title>
<style>
body {
  background: #fff8f1;
  color: #222;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
}
button {
  background: #ff641f;
  color: white;
  border: 0;
  padding: 14px 22px;
  margin: 8px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}
canvas {
  width: 180px;
  height: 180px;
  margin: 20px;
  border-radius: 25px;
}
</style>
</head>
<body>

<h1>FOODRUSH</h1>
<p>Generate your professional FoodRush app icons.</p>

<canvas id="preview" width="512" height="512"></canvas>

<br>
<button onclick="downloadIcon(192)">Download 192px Icon</button>
<button onclick="downloadIcon(512)">Download 512px Icon</button>

<script>
function drawIcon(canvas, size) {
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ff641f";
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = "#fff8f1";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `bold ${size * 0.205}px Arial, sans-serif`;
  ctx.fillText("FOOZY", size / 2, size / 2);

  return canvas;
}

drawIcon(document.getElementById("preview"), 512);

function downloadIcon(size) {
  const canvas = document.createElement("canvas");
  drawIcon(canvas, size);

  const link = document.createElement("a");
  link.download = `foozy-${size}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
